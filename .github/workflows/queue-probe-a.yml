# The target of the endpoint approve in the queue probe (queue-probe.yml).
name: Queue probe A

on:
  pull_request:

permissions: {}

jobs:
  held:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write who started the run
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
        run: echo "The run started. actor=$ACTOR trigger=$TRIGGER"
